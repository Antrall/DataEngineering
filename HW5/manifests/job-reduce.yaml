apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hw5-pairs:1
          imagePullPolicy: IfNotPresent
          args: ["--mode", "reduce", "--partials-prefix", "${PARTIALS_PREFIX}", "--output-prefix", "${OUTPUT_PREFIX}"]
          env:
            - name: S3_ENDPOINT
              value: "${S3_ENDPOINT}"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
